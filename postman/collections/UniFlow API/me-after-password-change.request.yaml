$kind: http-request
name: Me after password change
method: GET
url: '{{base_url}}/api/me'
order: 18600
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{student_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('the new token still opens the account', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().user.university_id).to.eql(pm.collectionVariables.get('student_university_id'));
      });
