$kind: http-request
name: Me old token after password change
method: GET
url: '{{base_url}}/api/me'
order: 18400
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{student_token_previous}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('the token used to change the password is revoked', function () {
        pm.response.to.have.status(401);
      });
