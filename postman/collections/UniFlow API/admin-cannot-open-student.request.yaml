$kind: http-request
name: Admin cannot open student
method: GET
url: '{{base_url}}/api/student'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('admin is forbidden from the student area', function () {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().message).to.eql('ليس لديك صلاحية للوصول إلى هذا الطلب.');
      });
