$kind: http-request
name: Change password wrong current
method: PUT
url: '{{base_url}}/api/password'
order: 18100
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{student_token}}'
body:
  type: json
  content: |-
    {
      "current_password": "wrong-password",
      "password": "student3001a",
      "password_confirmation": "student3001a"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('wrong current password is rejected', function () {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().errors.current_password[0]).to.eql('كلمة المرور الحالية غير صحيحة.');
      });
