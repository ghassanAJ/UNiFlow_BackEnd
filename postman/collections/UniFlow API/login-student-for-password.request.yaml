$kind: http-request
name: Login student for password change
method: POST
url: '{{base_url}}/api/login'
order: 18000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "university_id": "{{student_university_id}}",
      "password": "{{student_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('student logs in before changing password', function () {
        pm.response.to.have.status(200);
        pm.collectionVariables.set('student_token', pm.response.json().token);
      });
