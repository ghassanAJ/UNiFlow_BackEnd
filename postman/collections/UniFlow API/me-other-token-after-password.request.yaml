$kind: http-request
name: Me other token after password change
method: GET
url: '{{base_url}}/api/me'
order: 18500
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{student_token_other}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('the other device token is revoked after a password change', function () {
        pm.response.to.have.status(401);
      });
