$kind: http-request
name: Student cannot open teacher
method: GET
url: '{{base_url}}/api/teacher'
order: 13000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{student_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('student is forbidden from the teacher area', function () {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().message).to.eql('ليس لديك صلاحية للوصول إلى هذا الطلب.');
      });
