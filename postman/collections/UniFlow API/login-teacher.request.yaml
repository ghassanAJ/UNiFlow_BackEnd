$kind: http-request
name: Login teacher
method: POST
url: '{{base_url}}/api/login'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "university_id": "{{teacher_university_id}}",
      "password": "{{teacher_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('teacher login returns a bearer token', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.user.role).to.eql('teacher');
        pm.expect(body.token).to.be.a('string').and.not.empty;
        pm.collectionVariables.set('teacher_token', body.token);
      });
