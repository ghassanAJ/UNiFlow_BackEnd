$kind: http-request
name: Change password
method: PUT
url: '{{base_url}}/api/password'
order: 18300
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{student_token}}'
body:
  type: json
  content: |-
    {
      "current_password": "{{student_password}}",
      "password": "student3001a",
      "password_confirmation": "student3001a"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('password change returns a new token', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.message).to.eql('تم تغيير كلمة المرور.');
        pm.expect(body.token_type).to.eql('Bearer');
        pm.expect(body.token).to.be.a('string').and.not.empty;
        pm.expect(body.token).to.not.eql(pm.collectionVariables.get('student_token'));
        pm.collectionVariables.set('student_token_previous', pm.collectionVariables.get('student_token'));
        pm.collectionVariables.set('student_token', body.token);
      });
