$kind: http-request
name: Teacher cannot open admin
method: GET
url: '{{base_url}}/api/admin'
order: 8000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{teacher_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('teacher is forbidden from the admin area', function () {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().message).to.eql('ليس لديك صلاحية للوصول إلى هذا الطلب.');
      });
