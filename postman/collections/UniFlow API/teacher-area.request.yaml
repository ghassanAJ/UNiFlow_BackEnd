$kind: http-request
name: Teacher area
method: GET
url: '{{base_url}}/api/teacher'
order: 7000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{teacher_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('teacher area returns the role without permissions', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.role).to.eql('teacher');
        pm.expect(body.permissions).to.be.undefined;
      });
