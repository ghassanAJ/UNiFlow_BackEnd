$kind: http-request
name: Restore student password
method: PUT
url: '{{base_url}}/api/password'
order: 18700
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{student_token}}'
body:
  type: json
  content: |-
    {
      "current_password": "student3001a",
      "password": "{{student_password}}",
      "password_confirmation": "{{student_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('student password is restored for the next run', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().message).to.eql('تم تغيير كلمة المرور.');
        pm.collectionVariables.set('student_token', pm.response.json().token);
      });
